<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Question Queue</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='2,28 16,4 30,28' fill='%235d707e'/><polygon points='16,4 11,13 14,15 16,12 19,15 21,13' fill='white'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="a-top">
      <div class="a-brand">
        <h1>Top of the World</h1>
        <span>Question queue</span>
      </div>
      <div class="a-summary" id="summary"></div>
      <button class="a-btn primary a-publish" id="publish" title="Send your days to everyone else">Publish</button>
    </header>
    <div class="a-layout">
      <aside class="a-days">
        <div class="a-search">
          <input id="search" type="search" placeholder="Search past questions…" autocomplete="off" />
        </div>
        <div id="days"></div>
      </aside>
      <main class="a-editor" id="editor"></main>
    </div>
    <datalist id="country-names"></datalist>
    <div class="a-toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/admin/admin.js"></script>
  </body>
</html>
